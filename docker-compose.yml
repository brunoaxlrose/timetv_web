version: '3.8'

services:
  web:
    build: .
    container_name: tvtime_clone
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      - APACHE_RUN_USER=www-data
      - APACHE_RUN_GROUP=www-data
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=tvtime_db
      - DB_USER=tvtime
      - DB_PASSWORD=tvtime_pass
    depends_on:
      - db
    restart: always

  db:
    image: postgres:15-alpine
    container_name: tvtime_db
    environment:
      - POSTGRES_DB=tvtime_db
      - POSTGRES_USER=tvtime
      - POSTGRES_PASSWORD=tvtime_pass
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata:
